server:
  port: ${PORT:8080}

spring:
  application:
    name: rental-auth-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rental_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,https://grab-rental.vercel.app}
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:true}
      name: ${DEFAULT_ADMIN_NAME:Super Administrator}
      email: ${DEFAULT_ADMIN_EMAIL:admin@example.com}
      password: ${DEFAULT_ADMIN_PASSWORD:Admin@123456}
      phone: ${DEFAULT_ADMIN_PHONE:+919876543210}
