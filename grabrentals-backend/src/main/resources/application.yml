server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: rental-auth-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rental_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 180000
      connection-timeout: 10000
      keepalive-time: 30000
      leak-detection-threshold: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,http://localhost:3001,http://localhost:3002}
  otp:
    expose-dev-otp: ${EXPOSE_DEV_OTP:false}
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:false}
      name: ${DEFAULT_ADMIN_NAME:System Administrator}
      email: ${DEFAULT_ADMIN_EMAIL:admin@grabrentals.com}
      password: ${DEFAULT_ADMIN_PASSWORD:}
      phone: ${DEFAULT_ADMIN_PHONE:}
    tariff:
      enabled: ${SEED_TARIFF_ENABLED:true}
      force: ${SEED_TARIFF_FORCE:false}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    api-url: ${WHATSAPP_API_URL:}
    api-key: ${WHATSAPP_API_KEY:}
    support-phone: ${WHATSAPP_SUPPORT_PHONE:9876543210}
    booking-confirmation-pdf-url: ${WHATSAPP_BOOKING_PDF_URL:https://whatsappdata.s3.ap-south-1.amazonaws.com/userMedia/95c67d929b9fee3507244cbb024c0e73/invoice.pdf}
    default-invoice-pdf-url: ${WHATSAPP_DEFAULT_INVOICE_PDF_URL:https://whatsappdata.s3.ap-south-1.amazonaws.com/userMedia/95c67d929b9fee3507244cbb024c0e73/invoice.pdf}
  sms:
    enabled: ${SMS_ENABLED:false}
    api-url: ${SMS_API_URL:}
    api-key: ${SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:}
    template-id: ${SMS_TEMPLATE_ID:}
    campaign-name: ${SMS_CAMPAIGN_NAME:API TEST}

